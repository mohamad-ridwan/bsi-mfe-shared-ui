name: "Sync PR Discussions & Reviews to Jira"

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  sync-to-jira:
    name: "Sync PR Discussion to Jira Comments"
    runs-on: ubuntu-latest
    steps:
      - name: "Post PR Activity to Jira Issue Comment via Node.js"
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_BASIC_AUTH: ${{ secrets.JIRA_API_BASIC_AUTH }}
        with:
          script: |
            const jiraBaseUrl = process.env.JIRA_BASE_URL;
            const jiraAuth = process.env.JIRA_API_BASIC_AUTH;

            if (!jiraBaseUrl || !jiraAuth) {
              console.log('Jira credentials not configured. Skipping sync.');
              return;
            }

            const payload = context.payload;
            const isReview = context.eventName === 'pull_request_review';
            const isComment = context.eventName === 'issue_comment';

            // Validasi hanya proses PR (bukan regular issue)
            if (isComment && !payload.issue.pull_request) {
              console.log('Not a pull request comment. Skipping.');
              return;
            }

            // Ekstrak issue key dari judul PR (misal BSI-9)
            const prTitle = (isReview ? payload.pull_request.title : payload.issue.title) || '';
            const match = prTitle.match(/([A-Z]+-[0-9]+)/);
            if (!match) {
              console.log(`No Jira issue key found in PR title: "${prTitle}". Skipping.`);
              return;
            }
            const issueKey = match[1];

            const actor = context.actor;
            let header = '';
            let rawBody = '';
            let targetUrl = '';

            if (isReview) {
              const state = payload.review.state;
              rawBody = payload.review.body || '(Tidak ada catatan tertulis)';
              targetUrl = payload.review.html_url;

              if (state === 'changes_requested') {
                header = `🚨 [QC Service Review] REQUEST CHANGES oleh @${actor}`;
              } else if (state === 'approved') {
                header = `✅ [QC Service Review] APPROVED oleh @${actor}`;
              } else {
                header = `💬 [Code Review Comment] oleh @${actor}`;
              }
            } else if (isComment) {
              rawBody = payload.comment.body || '';
              targetUrl = payload.comment.html_url;
              header = `💬 [PR Discussion] @${actor} membalas di Pull Request`;
            }

            const commentContent = `${header}\n\n${rawBody}\n\n🔗 Lihat di GitHub: ${targetUrl}`;

            const cleanHost = jiraBaseUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
            const postData = JSON.stringify({
              body: {
                type: 'doc',
                version: 1,
                content: [
                  {
                    type: 'paragraph',
                    content: [
                      {
                        type: 'text',
                        text: commentContent,
                      },
                    ],
                  },
                ],
              },
            });

            const https = require('https');
            const options = {
              hostname: cleanHost,
              path: `/rest/api/3/issue/${issueKey}/comment`,
              method: 'POST',
              headers: {
                'Authorization': `Basic ${jiraAuth}`,
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Content-Length': Buffer.byteLength(postData),
              },
            };

            await new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                let resBody = '';
                res.on('data', (d) => (resBody += d));
                res.on('end', () => {
                  console.log(`Jira API Response: ${res.statusCode}`);
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    console.log(`Successfully synced PR review/comment from @${actor} to Jira issue ${issueKey}!`);
                    resolve();
                  } else {
                    console.error(`Failed to post comment to Jira: ${resBody}`);
                    // Jangan fail job agar tidak memblokir workflow lain jika hanya comment gagal
                    resolve();
                  }
                });
              });

              req.on('error', (e) => {
                console.error(`Request error: ${e.message}`);
                resolve();
              });

              req.write(postData);
              req.end();
            });
