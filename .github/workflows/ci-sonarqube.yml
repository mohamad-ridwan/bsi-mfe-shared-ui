name: "CI Pipeline: SonarQube Quality Gate & Unit Test Coverage"

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  code-quality-and-test:
    name: "Jest Test & SonarQube Quality Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "1. Checkout Source Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "2. Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "3. Install Dependencies (Clean Install)"
        run: npm ci

      - name: "4. TypeScript Type-Checking"
        id: type-check
        run: npm run type-check

      - name: "5. Execute Jest Unit Tests with Coverage & JSON Report"
        run: npx jest --coverage --json --outputFile=jest-results.json
        env:
          CI: true

      - name: "6. Verify LCOV Coverage Report Exists"
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "ERROR: coverage/lcov.info not found! Jest failed to generate coverage."
            exit 1
          fi
          echo "LCOV coverage report verified successfully."

      - name: "7. SonarQube Scan"
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "8. SonarQube Quality Gate Check"
        id: sonar-quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: "8b. Sync Jira Smart Checklist (DoD & AC Verification)"
        if: always()
        run: |
          JIRA_ISSUE_KEY=$(echo "${{ github.head_ref || github.event.pull_request.title }}" | grep -o -E '[A-Z]+-[0-9]+' | head -n 1)
          if [ -n "$JIRA_ISSUE_KEY" ]; then
            export JIRA_ISSUE_KEY="$JIRA_ISSUE_KEY"
            export JIRA_BASE_URL="${{ secrets.JIRA_BASE_URL }}"
            export JIRA_API_BASIC_AUTH="${{ secrets.JIRA_API_BASIC_AUTH }}"
            export TYPECHECK_PASSED="${{ steps.type-check.outcome == 'success' && 'true' || 'false' }}"
            export SONAR_GATE_STATUS="${{ steps.sonar-quality-gate.outcome == 'success' && 'PASSED' || 'FAILED' }}"
            node scripts/update-jira-checklist.js
          fi


