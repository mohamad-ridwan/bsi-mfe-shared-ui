name: "Mirror Repository to GitLab"

on:
  push:
    branches:
      - '**'

jobs:
  sync-to-gitlab:
    name: "Sync GitHub to GitLab Mirror"
    runs-on: ubuntu-latest
    steps:
      - name: "1. Checkout Source Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "2. Push All Branches to GitLab Mirror"
        run: |
          echo "Syncing all branches to GitLab mirror..."
          git push --prune "https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/mohamad-ridwan/bsi-mfe-shared-ui.git" "+refs/remotes/origin/*:refs/heads/*"

